name: Pulse Control - Compilar APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compilar y verificar APK Android
    runs-on: ubuntu-24.04
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub ubuntu-24.04 already includes the Android SDK.
      # Do not use android-actions/setup-android here: it was failing
      # before the Android project had a chance to compile.
      - name: Verificar SDK de Android del runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "SDK no encontrado: $SDK"; exit 1; }
          echo "SDK disponible en: $SDK"
          ls -la "$SDK/platforms" || true
          ls -la "$SDK/build-tools" || true
          if [ ! -d "$SDK/platforms/android-35" ] || [ ! -d "$SDK/build-tools/35.0.0" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
            test -x "$SDKMANAGER" || { echo "sdkmanager no encontrado: $SDKMANAGER"; exit 1; }
            "$SDKMANAGER" --sdk_root="$SDK" --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar estructura y tareas
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          if find . -name '*.gradle.kts' | grep -q .; then echo 'ERROR: Archivos Gradle antiguos .kts'; exit 1; fi
          gradle --no-daemon :app:tasks --all | tee gradle-tasks.txt
          grep -q 'assembleDebug' gradle-tasks.txt
      - name: Compilar APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar APK generada
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256.txt
      - name: Publicar APK y checksum
        uses: actions/upload-artifact@v4
        with:
          name: PulseControl-v1.4.1-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256.txt
          if-no-files-found: error
