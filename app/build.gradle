plugins { id 'com.android.application' }

android {
    namespace 'com.pulsecontrol.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pulsecontrol.app'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '1.4.1-muse-control'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
